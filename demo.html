<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#14241d"><title>五萬星願模擬・共聚菩提</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101a18;color:#fff4d5;font-family:ui-serif,"Noto Serif TC",Georgia,serif;overflow:hidden}.scene{position:relative;width:100vw;height:100svh;isolation:isolate;background:linear-gradient(180deg,#101b2080,#101a18cf 70%,#0b1411),url('batu-kawan.jpg') center 43%/cover no-repeat}.title{position:absolute;top:5vh;left:50%;transform:translateX(-50%);z-index:4;text-align:center;width:90%;text-shadow:0 2px 18px #07100d}.eyebrow{font:600 10px system-ui;letter-spacing:.38em;color:#eed797}.title h1{margin:9px 0;font-size:clamp(25px,4vw,40px);font-weight:500;letter-spacing:.14em}.title p{margin:0;color:#eee3c7;font-size:14px}.stat{position:absolute;right:20px;top:20px;z-index:4;padding:9px 13px;border:1px solid #f5e2ac55;border-radius:20px;background:#0d1713bf;font:12px system-ui;backdrop-filter:blur(8px)}.tree{position:absolute;width:min(78vw,760px);height:min(76vh,670px);left:50%;top:56%;transform:translate(-50%,-50%);overflow:visible;filter:drop-shadow(0 14px 30px #050b09b0)}.stars,.twinkle{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.stars{z-index:2}.twinkle{z-index:3}.trunk{fill:none;stroke:#745333;stroke-width:26;stroke-linecap:round;stroke-linejoin:round}.branch{fill:none;stroke:#60462d;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.twig{fill:none;stroke:#735438;stroke-width:7;stroke-linecap:round}.canopy{fill:#183426e8;stroke:#60784d;stroke-width:3}.back{position:absolute;left:18px;top:18px;z-index:5;padding:9px 13px;border:1px solid #f4dfad55;border-radius:22px;background:#0c1713c9;color:#f4e5bd;text-decoration:none;font:12px system-ui;backdrop-filter:blur(6px)}.foot{position:absolute;bottom:19px;left:50%;transform:translateX(-50%);z-index:4;font:11px system-ui;color:#ddd1aa99;white-space:nowrap}.ground{position:absolute;bottom:0;width:100%;height:14vh;background:linear-gradient(0deg,#09110e,transparent);pointer-events:none}
</style></head>
<body><main class="scene"><a class="back" href="/bodhi-star-garden/">← 回到許願頁</a><div class="title"><div class="eyebrow">BATU KAWAN · 星願演示</div><h1>五萬顆星，匯聚菩提</h1><p>每一點都是一顆垂掛枝間的星願</p></div><div class="stat">畫面模擬 · 50,000 顆星</div><svg class="tree" viewBox="0 0 800 720" aria-label="掛滿星星的菩提樹"><path class="canopy" d="M400 78C319 44 230 67 193 116 121 100 67 152 80 211 24 243 47 313 104 333 67 389 114 443 177 426 210 492 291 493 334 456L400 473 466 456C509 493 590 492 623 426 686 443 733 389 696 333 753 313 776 243 720 211 733 152 679 100 607 116 570 67 481 43 400 78Z"/><g class="branch"><path d="M400 650C390 520 400 420 398 330S395 210 402 140"/><path d="M399 390C320 340 260 290 190 220M400 360C480 320 540 270 610 215M398 300C345 250 315 200 270 145M402 280C465 235 495 185 535 138M399 445C325 410 265 375 200 340M401 425C480 390 540 355 605 315M398 535C345 495 305 455 265 415M402 525C460 485 505 445 545 402"/></g><g class="twig"><path d="M300 290L240 235M500 275L570 220M320 370L245 345M480 370L560 335M355 230L300 175M450 220L510 165"/></g><path class="trunk" d="M400 660C390 530 400 430 398 340S395 210 402 140"/></svg><canvas class="stars"></canvas><canvas class="twinkle"></canvas><div class="ground"></div><div class="foot">僅供視覺測試，不會寫入共享資料庫</div></main>
<script>
const total=50000,base=document.querySelector('.stars'),glow=document.querySelector('.twinkle'),tree=document.querySelector('.tree'),dpr=Math.min(devicePixelRatio||1,2);let sparkles=[];
function paint(){const r=tree.getBoundingClientRect(),scene=document.querySelector('.scene').getBoundingClientRect();for(const c of [base,glow]){c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.style.left=(r.left-scene.left)+'px';c.style.top=(r.top-scene.top)+'px';c.style.width=r.width+'px';c.style.height=r.height+'px'}const ctx=base.getContext('2d'),g=glow.getContext('2d');ctx.scale(dpr,dpr);g.scale(dpr,dpr);const w=r.width,h=r.height,sx=w/800,sy=h/720;for(let i=0;i<total;i++){const a=Math.random()*Math.PI*2,q=Math.sqrt(Math.random()),x=(400+Math.cos(a)*q*310)*sx,y=(270+Math.sin(a)*q*184)*sy,size=(.6+Math.random()*1.35)*Math.max(.8,sx);ctx.globalAlpha=.24+Math.random()*.7;ctx.fillStyle=Math.random()<.12?'#fff8da':'#ffd875';ctx.fillRect(x,y,size,size);if(i%5===0){ctx.strokeStyle='rgba(255,226,165,.44)';ctx.lineWidth=Math.max(.4,sx*.65);ctx.beginPath();ctx.moveTo(x+size/2,y+size);ctx.lineTo(x+size/2,y+size+2.7*sy);ctx.stroke()}if(i%140===0)sparkles.push({x,y,r:size*2.4,p:Math.random()*6})}ctx.globalAlpha=1;function pulse(t){g.clearRect(0,0,w,h);for(const s of sparkles){g.globalAlpha=.25+.7*(Math.sin(t/900+s.p)+1)/2;g.fillStyle='#fff6cf';g.beginPath();g.arc(s.x,s.y,s.r,0,Math.PI*2);g.fill()}g.globalAlpha=1;requestAnimationFrame(pulse)}requestAnimationFrame(pulse)}
paint();addEventListener('resize',()=>location.reload());
</script></body></html>
