<style>
:root{--gold:#ffe6a0;--ink:#f8f3e8}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-serif,"Noto Serif TC",Georgia,serif;background:#101b18;overflow:hidden}.scene{position:relative;min-height:100svh;isolation:isolate;background:linear-gradient(180deg,rgba(8,18,19,.36),rgba(9,20,17,.7) 57%,#101c18 100%),url('batu-kawan.jpg') center 43%/cover no-repeat}.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 20%,rgba(5,13,12,.42) 100%);z-index:-1}.top{position:absolute;top:clamp(22px,5vh,55px);left:50%;transform:translateX(-50%);width:min(92%,740px);text-align:center;z-index:3;text-shadow:0 2px 18px #06100c}.eyebrow{font:600 10px/1.6 system-ui,sans-serif;letter-spacing:.38em;color:#f3d999}.top h1{margin:8px 0 5px;font-size:clamp(24px,4vw,40px);font-weight:500;letter-spacing:.14em}.top p{margin:0;font-size:clamp(12px,1.6vw,15px);color:#eee4ca;letter-spacing:.08em}.stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s ease}.tree{width:min(64vw,560px);height:min(57vh,520px);position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);filter:drop-shadow(0 16px 32px #050b0970);overflow:visible}.star-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.trunk{fill:none;stroke:url(#bark);stroke-linecap:round;stroke-linejoin:round}.branch{fill:none;stroke:#503a25;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}.barkline{fill:none;stroke:#98734b;stroke-width:2;opacity:.5;stroke-linecap:round}.leaf{fill:url(#leaf);stroke:#8e9a62;stroke-width:1.3;opacity:.92}.leaf-vein{fill:none;stroke:#bec48d;stroke-width:1;opacity:.52}.canopy-shadow{fill:#14241c;opacity:.55}.hangdrop{animation:sway 3.8s ease-in-out infinite;transform-box:fill-box;transform-origin:top center;cursor:pointer}.cord{stroke:#f6d98d;stroke-width:1.5;opacity:.9}.starcore{fill:#fff5ce;stroke:#fff0b1;stroke-width:.7;filter:url(#glow)}.ornament-glow{fill:#ffd976;opacity:.18;filter:url(#softglow)}.twinkle{animation:pulse 2.2s ease-in-out infinite}.ground{position:absolute;bottom:0;height:15vh;width:100%;background:linear-gradient(0deg,#0a1511,transparent);pointer-events:none}.form{position:absolute;top:70%;bottom:auto;left:50%;transform:translate(-50%,-50%);z-index:4;width:min(92%,460px);text-align:center;padding:20px;border:1px solid #e4cc8b45;border-radius:24px;background:linear-gradient(145deg,#0c1915dc,#15251ee6);box-shadow:0 16px 48px #030a08a0;backdrop-filter:blur(14px)}.form label{display:block;font-size:13px;letter-spacing:.12em;color:#ead9ad;margin-bottom:11px}.row{display:flex;gap:9px}.row input{min-width:0;flex:1;border:1px solid #cbb87b66;border-radius:12px;background:#07110fd9;color:white;padding:14px 15px;font:16px system-ui;outline:none}.row input:focus{border-color:#f6d98d;box-shadow:0 0 0 3px #f6d98d20}.row button{border:0;border-radius:12px;padding:0 18px;color:#342711;background:linear-gradient(135deg,#fff0bd,#d9b862);font:600 14px system-ui;white-space:nowrap;cursor:pointer;box-shadow:0 5px 20px #d7b65830}.row button:hover{filter:brightness(1.08);transform:translateY(-1px)}.note{font:11px/1.5 system-ui;color:#b6b9a5;margin-top:10px}.journey .stage{opacity:1;visibility:visible}.journey .count{opacity:1}.journey .form{opacity:0;transform:translate(-50%,18px);pointer-events:none;transition:opacity .35s ease,transform .5s ease}.count{position:absolute;right:20px;top:20px;z-index:3;padding:8px 12px;border:1px solid #f4dfad42;border-radius:20px;background:#0c1713a8;color:#eddfbc;font:11px system-ui;backdrop-filter:blur(6px);opacity:0;transition:opacity .8s ease}.toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-12px);z-index:8;opacity:0;pointer-events:none;padding:11px 18px;border-radius:30px;background:#10211ae8;border:1px solid #f6d98d70;color:#ffedb8;font-size:14px;transition:.5s}.toast.show{opacity:1;transform:translate(-50%,0)}.flying{position:fixed;z-index:10;width:34px;height:34px;pointer-events:none;filter:drop-shadow(0 0 14px #ffdc7a)}.flying svg{overflow:visible}.flying:before{content:"";position:absolute;width:105px;height:3px;right:21px;top:15px;transform:rotate(-35deg);transform-origin:right center;border-radius:9px;background:linear-gradient(90deg,transparent,#ffe7a5aa 58%,#fff8d7);filter:blur(1px)}.flying-name{position:absolute;right:35px;top:-13px;color:#fff0bf;font:500 13px/1.2 system-ui,sans-serif;white-space:nowrap;text-shadow:0 0 8px #ffca55,0 1px 5px #07100c;letter-spacing:.04em}.tip{position:absolute;display:none;z-index:9;transform:translate(-50%,-115%);padding:7px 11px;background:#0a1512ed;border:1px solid #f1d58f77;border-radius:9px;color:#ffedbd;font:13px system-ui;white-space:nowrap}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff0bd;box-shadow:0 0 8px #fff0bd;animation:pulse 3s infinite;opacity:.65}@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@keyframes pulse{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}@media(max-width:600px){.tree{width:84vw;height:46vh;top:48%}.top{top:25px}.top h1{font-size:25px}.form{top:68%;bottom:auto;padding:16px}.row button{padding:0 13px}.count{top:auto;bottom:204px;right:15px}.scene{background-position:52% center}.ground{height:22vh}}
</style></head>
<body><main class="scene" id="scene"><div class="top"><div class="eyebrow">BATU KAWAN · 一人一星</div><h1>让星光，栖于菩提</h1><p>写下名字，让一颗心愿成为树梢间的光</p></div><div class="count" id="count">枝间星愿 · 0</div><div class="stage"><svg class="tree" id="tree" viewBox="0 0 800 720" role="img" aria-label="枝叶舒展的菩提树，星星挂在枝条下">
<defs><linearGradient id="bark" x1="0" x2="1"><stop stop-color="#392a1d"/><stop offset=".48" stop-color="#8b6740"/><stop offset="1" stop-color="#4a3522"/></linearGradient><linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ba775"/><stop offset=".45" stop-color="#49694b"/><stop offset="1" stop-color="#274434"/></linearGradient><filter id="glow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softglow" x="-300%" y="-300%" width="700%" height="700%"><feGaussianBlur stdDeviation="7"/></filter></defs>
<!-- canopy silhouette and visible sweeping limbs -->
<path class="canopy-shadow" d="M400 75C319 43 230 67 193 116 121 100 67 152 80 211 24 243 47 313 104 333 67 389 114 443 177 426 210 492 291 493 334 456L400 473 466 456C509 493 590 492 623 426 686 443 733 389 696 333 753 313 776 243 720 211 733 152 679 100 607 116 570 67 481 43 400 75Z"/>
<g class="branch"><path d="M400 610C391 528 398 438 398 360C397 286 394 219 402 150"/><path d="M397 379C330 336 267 292 203 232M399 351C466 315 532 270 604 224M399 298C345 254 317 201 278 151M402 277C466 233 492 185 526 139M397 433C326 400 269 372 204 339M401 416C479 384 534 354 599 316M397 522C343 487 308 460 269 421M402 511C460 477 501 448 542 407"/></g>
<g class="barkline"><path d="M400 605C405 495 387 404 405 313S394 202 402 156M397 373C320 320 265 274 208 236M402 356C484 312 541 272 598 229M398 431C333 397 268 369 210 343M404 414C480 385 536 351 591 320"/></g>
<!-- individual heart-shaped bodhi leaves -->
<g id="leaves"></g><g id="ornaments"></g></svg><canvas class="star-canvas" id="starCanvas" aria-label="菩提樹上的星願"></canvas></div><div class="ground"></div><div class="toast" id="toast"></div><div class="tip" id="tip"></div>
<form class="form" id="form"><label for="name">留下你的名字</label><div class="row"><input id="name" maxlength="24" autocomplete="name" placeholder="输入名字或祝福" required><button type="submit">挂上星愿 ✦</button></div><div class="note">每颗星星都会垂挂在枝条下，轻轻摇曳</div></form></main>
<script src="config.js"></script><script>
const svgNS='http://www.w3.org/2000/svg',leaves=document.querySelector('#leaves'),ornaments=document.querySelector('#ornaments'),tree=document.querySelector('#tree'),form=document.querySelector('#form'),input=document.querySelector('#name'),count=document.querySelector('#count'),toast=document.querySelector('#toast');
// Leaf groups follow the branching structure; the long pointed tip identifies a Bodhi leaf.
const clusters=[[400,105,9,58],[310,112,8,55],[490,110,8,55],[225,157,9,52],[575,156,9,52],[145,218,9,48],[655,215,9,48],[310,204,7,47],[495,199,7,47],[245,270,8,49],[556,264,8,49],[168,315,7,45],[628,312,7,45],[333,322,7,44],[467,315,7,44],[220,370,7,42],[580,366,7,42],[300,404,6,40],[510,399,6,40],[400,210,8,48],[400,272,7,44]];
function leafPath(x,y,s,rot){let g=document.createElementNS(svgNS,'g');g.setAttribute('transform',`translate(${x} ${y}) rotate(${rot}) scale(${s/48})`);g.innerHTML='<path class="leaf" d="M0 0 C-8 -12 -20 -18 -22 -32 C-24 -44 -11 -48 0 -31 C11 -48 24 -44 22 -32 C20 -18 8 -12 0 0Z"/><path class="leaf-vein" d="M0 -1L0 -34M0 -20L-12 -33M0 -18L12 -33"/>';leaves.append(g)}
clusters.forEach(([x,y,n,s],ci)=>{for(let i=0;i<n;i++){const a=i*2.399+ci*.8,r=Math.sqrt((i+.5)/n)*s;leafPath(x+Math.cos(a)*r*1.1,y+Math.sin(a)*r*.72,s*.7+Math.random()*12,(Math.cos(a)*20));}});
const branchPts=[[228,240],[282,292],[350,327],[573,232],[520,280],[454,320],[230,344],[300,376],[545,324],[488,365],[278,430],[530,415],[340,230],[460,230],[400,180],[175,230],[625,230],[400,375],[350,400],[450,400]];
const starShape='<path class="starcore" d="M0-11 2.8-3.1 11-2.5 4.7 2.6 6.8 10.5 0 6.1-6.8 10.5-4.7 2.6-11-2.5-2.8-3.1Z"/>';let starsCache=[],starTargets=[];async function readPage(offset){const url=new URL(window.BODHI_API_URL);url.searchParams.set('offset',String(offset));url.searchParams.set('limit','1000');const response=await fetch(url,{headers:{apikey:window.BODHI_PUBLISHABLE_KEY||'',Authorization:'Bearer '+(window.BODHI_PUBLISHABLE_KEY||'')}});if(!response.ok)throw new Error('shared stars unavailable');return response.json()}
async function getStars(){if(window.BODHI_API_URL){const first=await readPage(0),items=Array.isArray(first.stars)?first.stars:[],total=Number(first.total??items.length);for(let base=items.length;base<total;base+=8000){const offsets=[];for(let offset=base;offset<Math.min(total,base+8000);offset+=1000)offsets.push(offset);const pages=await Promise.all(offsets.map(readPage));for(const page of pages)if(Array.isArray(page.stars))items.push(...page.stars)}return items}try{return JSON.parse(localStorage.getItem('bodhi-stars-v2')||'[]')}catch{return []}}async function saveStar(name){if(window.BODHI_API_URL){const response=await fetch(window.BODHI_API_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:window.BODHI_PUBLISHABLE_KEY||'',Authorization:'Bearer '+(window.BODHI_PUBLISHABLE_KEY||'')},body:JSON.stringify({name})});if(!response.ok)throw new Error('star could not be saved');return (await response.json()).star}const list=await getStars(),item={name,created_at:new Date().toISOString()};list.push(item);localStorage.setItem('bodhi-stars-v2',JSON.stringify(list));return item}function renderFromCache(){const items=starsCache;ornaments.replaceChildren();const canvas=document.querySelector('#starCanvas');if(items.length>1200)drawMany(items);else{canvas.style.pointerEvents='none';canvas.width=canvas.width;items.forEach((item,i)=>draw(item,i))}count.textContent='枝间星愿 · '+items.length}async function render(){try{starsCache=await getStars();renderFromCache()}catch(error){console.error(error);count.textContent='星愿暂时无法读取'}}function drawMany(items){const canvas=document.querySelector('#starCanvas'),stage=document.querySelector('.stage'),r=tree.getBoundingClientRect(),sr=stage.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.style.pointerEvents='auto';canvas.width=Math.round(sr.width*dpr);canvas.height=Math.round(sr.height*dpr);const ctx=canvas.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);const sx=r.width/800,sy=r.height/720,left=r.left-sr.left,top=r.top-sr.top,segments=[[399,379,203,232],[399,351,604,224],[399,298,278,151],[402,277,526,139],[397,433,204,339],[401,416,599,316],[397,522,269,421],[402,511,542,407]];starTargets=[];for(let i=0;i<items.length;i++){let seed=(i+1)*2654435761>>>0;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};const seg=segments[Math.floor(rnd()*segments.length)],t=rnd(),x=seg[0]+(seg[2]-seg[0])*t,y=seg[1]+(seg[3]-seg[1])*t,drop=3+rnd()*5,px=left+x*sx,py=top+(y+drop)*sy,size=.75+rnd()*.7;ctx.globalAlpha=.46+rnd()*.42;ctx.strokeStyle='rgba(255,231,174,.7)';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(px,top+y*sy);ctx.lineTo(px,py-size*.5);ctx.stroke();ctx.fillStyle=rnd()<.14?'#fff9db':'#ffd875';ctx.beginPath();ctx.moveTo(px,py-size);ctx.lineTo(px+size*.32,py-size*.32);ctx.lineTo(px+size,py);ctx.lineTo(px+size*.32,py+size*.32);ctx.lineTo(px,py+size);ctx.lineTo(px-size*.32,py+size*.32);ctx.lineTo(px-size,py);ctx.lineTo(px-size*.32,py-size*.32);ctx.closePath();ctx.fill();if(i%97===0){ctx.globalAlpha=.25;ctx.fillStyle='#fff1b7';ctx.beginPath();ctx.arc(px,py,size*2.3,0,Math.PI*2);ctx.fill()}starTargets.push({x:px,y:py,name:items[i].name})}ctx.globalAlpha=1}
document.querySelector('#starCanvas').addEventListener('click',e=>{if(!starTargets.length)return;const r=e.currentTarget.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let nearest=null,distance=22;for(const star of starTargets){const d=Math.hypot(star.x-x,star.y-y);if(d<distance){distance=d;nearest=star}}if(nearest){const tip=document.querySelector('#tip');tip.textContent=nearest.name;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.style.display='block';setTimeout(()=>tip.style.display='none',2200)}});
window.addEventListener('resize',()=>{if(starsCache.length>1200)drawMany(starsCache)});

function draw(item,i){let [x,y]=branchPts[i%branchPts.length],layer=Math.floor(i/branchPts.length);x+=((i*37)%19)-9;y+=layer*13;let anchor=document.createElementNS(svgNS,'g');anchor.setAttribute('transform',`translate(${x} ${y})`);anchor.dataset.name=item.name;let swing=document.createElementNS(svgNS,'g');swing.setAttribute('class','hangdrop twinkle');swing.style.animationDelay=`${i%9*.19}s`;swing.innerHTML=`<line class="cord" x1="0" y1="-15" x2="0" y2="0"/><circle class="ornament-glow" cy="9" r="14"/>${starShape}`;anchor.append(swing);anchor.addEventListener('click',()=>{let tip=document.querySelector('#tip'),pt=tree.createSVGPoint();pt.x=x;pt.y=y-15;let screen=pt.matrixTransform(tree.getScreenCTM());tip.textContent=item.name;tip.style.left=screen.x+'px';tip.style.top=screen.y+'px';tip.style.display='block';setTimeout(()=>tip.style.display='none',2200)});ornaments.append(anchor)}
function fly(name,sourceRect){
 const idx=starsCache.length%branchPts.length,[x,y]=branchPts[idx],pt=tree.createSVGPoint();pt.x=x;pt.y=y-15;
 const dest=pt.matrixTransform(tree.getScreenCTM()),src=sourceRect||form.getBoundingClientRect(),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
 canvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:10;pointer-events:none';document.body.append(canvas);
 const dpr=Math.min(devicePixelRatio||1,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;ctx.scale(dpr,dpr);
 const sx=src.left+src.width*.5,sy=src.top-5,ex=dest.x,ey=dest.y;
 const bendX=Math.min(sx,ex)-Math.min(290,innerWidth*.48),bendY=Math.min(sy,ey)-Math.min(250,innerHeight*.34);
 const curve=t=>({x:(1-t)*(1-t)*sx+2*(1-t)*t*bendX+t*t*ex,y:(1-t)*(1-t)*sy+2*(1-t)*t*bendY+t*t*ey});
 const begin=performance.now(),duration=2700,dust=[];let lastEmit=begin;
 function frame(now){const raw=Math.min(1,(now-begin)/duration),progress=raw*raw*(3-2*raw),head=curve(progress),before=curve(Math.max(0,progress-.62));
  ctx.clearRect(0,0,innerWidth,innerHeight);
  if(progress>.015){
   // Draw a tapered, layered ribbon instead of a uniformly thick streak.
   ctx.lineCap='round';ctx.shadowColor='#ffe294';ctx.shadowBlur=24;
   for(let layer=0;layer<3;layer++){const span=.68-layer*.07,steps=34;for(let j=0;j<steps;j++){const u=j/steps,t1=Math.max(0,progress-span+u*span),t2=Math.max(0,progress-span+(u+1/steps)*span),a=curve(t1),b=curve(t2),weight=u*u;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=layer===0?`rgba(255,215,111,${.025+weight*.11})`:layer===1?`rgba(255,229,156,${.018+weight*.08})`:`rgba(255,244,202,${.008+weight*.045})`;ctx.lineWidth=(layer===0?26:layer===1?13:4)*(0.18+weight*.82);ctx.stroke()}}ctx.shadowBlur=0;
   // Emit stable flecks along the wake; they drift and fade instead of blinking in place.
   const elapsed=Math.min(80,now-lastEmit);lastEmit=now;const tangent=curve(Math.min(1,progress+.004)),dx=tangent.x-head.x,dy=tangent.y-head.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;
   for(let k=0;k<Math.ceil(elapsed*.23);k++){const lag=Math.random()*.52+.025,t=Math.max(0,progress-lag),q=curve(t),spread=5+lag*43,side=(Math.random()-.5)*spread;dust.push({x:q.x+nx*side,y:q.y+ny*side,vx:(Math.random()-.5)*.24,vy:-.08-Math.random()*.32,size:.45+Math.random()*1.5,life:550+Math.random()*650,age:0,phase:Math.random()*6})}
   for(let i=dust.length-1;i>=0;i--){const p=dust[i];p.age+=elapsed;if(p.age>=p.life){dust.splice(i,1);continue}p.x+=p.vx*elapsed;p.y+=p.vy*elapsed;const fade=Math.sin(Math.PI*p.age/p.life)*(1-p.age/p.life*.35);ctx.globalAlpha=fade;ctx.fillStyle=p.phase>3.3?'#ffd765':'#fff0ba';ctx.shadowColor='#ffe28c';ctx.shadowBlur=5;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;
   ctx.globalAlpha=1;ctx.shadowColor='#ffd95f';ctx.shadowBlur=32;const r=10;ctx.fillStyle='#fff8d7';ctx.beginPath();ctx.moveTo(head.x,head.y-r);ctx.quadraticCurveTo(head.x+2,head.y-2,head.x+r,head.y);ctx.quadraticCurveTo(head.x+2,head.y+2,head.x,head.y+r);ctx.quadraticCurveTo(head.x-2,head.y+2,head.x-r,head.y);ctx.quadraticCurveTo(head.x-2,head.y-2,head.x,head.y-r);ctx.fill();ctx.shadowBlur=0;
   ctx.font='13px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(255,239,185,.9)';ctx.shadowColor='#d9a834';ctx.shadowBlur=8;ctx.fillText(name,head.x,head.y+23);ctx.shadowBlur=0;
  }
  if(raw<1)requestAnimationFrame(frame);else{canvas.remove();(async()=>{try{const saved=await saveStar(name);if(saved){starsCache.push(saved);renderFromCache()}else await render();toast.textContent=`${name} 的星愿，已挂上枝头`}catch(error){console.error(error);toast.textContent='星愿暂时没有保存成功，请稍后重试'}toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3200)})()}
 }
 requestAnimationFrame(frame)
}
function escapeText(value){return value.replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
form.addEventListener('submit',e=>{e.preventDefault();let name=input.value.trim();if(!name)return;const source=form.getBoundingClientRect();document.body.classList.add('journey');fly(name,source);input.value=''});document.querySelectorAll('body').forEach(()=>{});for(let i=0;i<28;i++){let s=document.createElement('i');s.className='spark';s.style.left=(Math.random()*100)+'%';s.style.top=(10+Math.random()*74)+'%';s.style.animationDelay=(Math.random()*4)+'s';document.querySelector('.scene').append(s)}render();
</script></body></html>
